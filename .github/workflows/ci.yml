name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest + coverage
        run: |
          pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install pip-audit==2.10.1
      - name: pip-audit
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: devsecops-automation-engine:ci

      - name: Run container and hit /health
        run: |
          docker run -d --name engine -p 8000:8000 \
            -e DEVSECOPS_ENVIRONMENT=production devsecops-automation-engine:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 2
          done
          [ "${ok:-0}" = "1" ] || { docker logs engine; exit 1; }

      - name: Smoke-test the analyze endpoint
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/analyze \
            -H 'Content-Type: application/json' \
            -d '{"filename":"t.py","source_code":"import os\nAPI_KEY = \"AKIAIOSFODNN7EXAMPLE\"\n"}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['gate_passed'] is False; print('gate correctly failed')"

      - name: Trivy image scan (report-only)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            devsecops-automation-engine:ci

      - name: Stop container
        if: always()
        run: docker rm -f engine || true
