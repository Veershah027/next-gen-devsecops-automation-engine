<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>Security Workspace</title>
<meta name="description" content="Analyze code for security defects and verify remediation." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ─────────────────────────  Design tokens  ───────────────────────── */
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --surface-2: #f4f1ea;
    --surface-3: #ede9df;
    --border: #e7e1d5;
    --border-strong: #d8d1c1;
    --text: #26231d;
    --text-2: #6a6357;
    --text-3: #9b9384;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef0ff;
    --accent-text: #ffffff;
    --ok: #15803d;
    --ok-soft: #e9f5ec;
    --sev-critical: #c62828;
    --sev-critical-soft: #fbeaea;
    --sev-high: #d1571b;
    --sev-high-soft: #fbeee4;
    --sev-medium: #b6802a;
    --sev-medium-soft: #f8f0e0;
    --sev-low: #2563eb;
    --sev-low-soft: #e8eefe;
    --sev-info: #607080;
    --sev-info-soft: #eef1f3;
    --shadow-sm: 0 1px 2px rgba(31,28,20,.05);
    --shadow: 0 2px 8px rgba(31,28,20,.06), 0 1px 2px rgba(31,28,20,.04);
    --shadow-lg: 0 12px 40px rgba(31,28,20,.12);
    --radius: 12px;
    --radius-sm: 8px;
    --sidebar-w: 244px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --step: cubic-bezier(.32,.72,0,1);
  }
  .theme-dark {
    --bg: #1b1917;
    --surface: #232120;
    --surface-2: #2b2826;
    --surface-3: #34302d;
    --border: #38332e;
    --border-strong: #48423c;
    --text: #ece6db;
    --text-2: #a49d8f;
    --text-3: #706a5e;
    --accent: #8b8bf5;
    --accent-hover: #a3a3f8;
    --accent-soft: #2a2840;
    --accent-text: #16151f;
    --ok: #4ade80;
    --ok-soft: #1e2b22;
    --sev-critical: #f0736c; --sev-critical-soft: #33211f;
    --sev-high: #ef9761;   --sev-high-soft: #322620;
    --sev-medium: #d9b066; --sev-medium-soft: #302a1e;
    --sev-low: #7aa2f7;    --sev-low-soft: #202634;
    --sev-info: #98a6b3;   --sev-info-soft: #262a2d;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow: 0 2px 12px rgba(0,0,0,.35);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent-soft); }
  a { color: inherit; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

  /* ─────────────────────────  Shell  ───────────────────────── */
  .shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; overflow: hidden; }
  .shell.collapsed { --sidebar-w: 0px; }

  aside#sidebar {
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: transform .28s var(--step);
  }
  .sb-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: linear-gradient(150deg, var(--accent), #7c74f0);
    display: grid; place-items: center; color: #fff;
  }
  .brand-name { font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; }
  .sb-scroll { flex: 1; overflow-y: auto; padding: 6px 10px 10px; }
  .btn-new {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: calc(100% - 20px); margin: 4px 10px 12px;
    padding: 9px 12px; border-radius: var(--radius-sm);
    background: var(--accent); color: var(--accent-text);
    font-weight: 550; font-size: 13px;
    transition: background .15s, transform .1s;
  }
  .btn-new:hover { background: var(--accent-hover); }
  .btn-new:active { transform: translateY(1px); }
  .nav-group { margin-top: 10px; }
  .nav-label { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); padding: 6px 10px 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 7px 10px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 450; color: var(--text-2);
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--surface-3); color: var(--text); }
  .nav-item.active { background: var(--surface); color: var(--text); font-weight: 550; box-shadow: var(--shadow-sm); }
  .nav-item svg { width: 16px; height: 16px; flex: none; opacity: .8; }
  .nav-item .count { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-3); font-family: var(--mono); }
  .sb-foot { border-top: 1px solid var(--border); padding: 12px 16px; font-size: 11.5px; color: var(--text-3); display: flex; flex-direction: column; gap: 2px; }
  .sb-foot .row { display: flex; justify-content: space-between; gap: 8px; }
  .sb-foot code { font-family: var(--mono); font-size: 11px; }

  main#main { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  /* ─────────────────────────  Topbar  ───────────────────────── */
  header#topbar {
    height: 52px; flex: none;
    display: flex; align-items: center; gap: 12px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(1.4) blur(8px);
  }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center; color: var(--text-2);
    transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 17px; height: 17px; }
  #btn-drawer { display: none; }
  .top-title { font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; }
  .top-sep { width: 1px; height: 20px; background: var(--border); }
  .status-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px; border-radius: 100px; font-size: 11.5px; font-weight: 500;
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
  }
  .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .status-chip.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .status-chip.bad { color: var(--sev-critical); border-color: color-mix(in srgb, var(--sev-critical) 30%, transparent); }
  .status-chip.bad .dot { background: var(--sev-critical); }
  .status-chip .metric { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* ─────────────────────────  View container  ───────────────────────── */
  #view { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .page { max-width: 900px; margin: 0 auto; padding: 32px 28px 80px; }
  .page.wide { max-width: 1120px; }
  .page-title { font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
  .page-sub { color: var(--text-2); margin-top: 4px; font-size: 13.5px; }
  .section-title { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); margin: 28px 0 12px; }

  .banner {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--radius-sm);
    background: var(--sev-critical-soft); color: var(--sev-critical);
    border: 1px solid color-mix(in srgb, var(--sev-critical) 25%, transparent);
    font-size: 13px; font-weight: 500;
    margin-bottom: 16px;
  }
  .banner.warn { background: var(--sev-medium-soft); color: var(--sev-medium); border-color: color-mix(in srgb, var(--sev-medium) 25%, transparent); }
  .banner .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  /* ─────────────────────────  Welcome / hero  ───────────────────────── */
  .hero { text-align: center; padding: 8vh 0 40px; }
  .hero h1 { font-size: 30px; font-weight: 600; letter-spacing: -.03em; line-height: 1.2; }
  .hero p { color: var(--text-2); font-size: 15px; margin-top: 12px; max-width: 420px; margin-inline: auto; }
  .hero-btn {
    margin-top: 24px; display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px; border-radius: 100px;
    background: var(--accent); color: var(--accent-text); font-weight: 550; font-size: 14px;
    transition: background .15s, transform .1s;
  }
  .hero-btn:hover { background: var(--accent-hover); }
  .feature-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 44px; }
  .feature {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; text-align: left; box-shadow: var(--shadow-sm);
  }
  .feature svg { width: 18px; height: 18px; color: var(--accent); margin-bottom: 10px; }
  .feature h3 { font-size: 13px; font-weight: 600; }
  .feature p { font-size: 12px; color: var(--text-2); margin-top: 3px; line-height: 1.45; }

  /* ─────────────────────────  Thread / turns  ───────────────────────── */
  #thread { max-width: 860px; margin: 0 auto; padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 22px; }
  .turn { display: flex; flex-direction: column; gap: 10px; }
  .turn-user {
    align-self: flex-end; max-width: 82%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px 14px 4px 14px; padding: 12px 14px; box-shadow: var(--shadow-sm);
  }
  .turn-user .u-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; color: var(--text-2); }
  .u-code {
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; max-height: 130px; overflow: hidden; position: relative; white-space: pre; overflow-x: auto;
  }
  .u-code.expanded { max-height: none; }
  .u-code-fade { position: absolute; inset: auto 0 0 0; height: 40px; background: linear-gradient(transparent, var(--surface-2)); pointer-events: none; }
  .u-toggle { font-size: 11.5px; color: var(--accent); margin-top: 4px; }

  .turn-assistant { display: flex; gap: 12px; }
  .a-avatar { width: 26px; height: 26px; border-radius: 7px; flex: none; background: linear-gradient(150deg, var(--accent), #7c74f0); display: grid; place-items: center; color: #fff; margin-top: 2px; }
  .a-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  .working { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 13px; }
  .working .beacon { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .activity {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.7;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; max-height: 180px; overflow-y: auto; color: var(--text-2);
  }
  .activity .a-line { display: flex; gap: 8px; }
  .activity .a-agent { color: var(--accent); flex: none; }
  .activity .lvl-WARNING { color: var(--sev-medium); }
  .activity .lvl-ERROR { color: var(--sev-critical); }

  /* result summary */
  .summary-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .verdict {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px;
    font-size: 12px; font-weight: 600;
  }
  .verdict.pass { background: var(--ok-soft); color: var(--ok); }
  .verdict.fail { background: var(--sev-critical-soft); color: var(--sev-critical); }
  .meta-text { font-size: 12.5px; color: var(--text-2); }
  .agent-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .agent-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-2); font-family: var(--mono); }
  .agent-pill.ok { border-color: color-mix(in srgb, var(--ok) 30%, transparent); color: var(--ok); }
  .agent-pill.err { border-color: color-mix(in srgb, var(--sev-critical) 30%, transparent); color: var(--sev-critical); }

  /* ─────────────────────────  Finding cards  ───────────────────────── */
  .finding {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .finding-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; }
  .sev-tag {
    flex: none; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 5px; margin-top: 1px;
  }
  .sev-critical .sev-tag, .sc { background: var(--sev-critical-soft); color: var(--sev-critical); }
  .sev-high .sev-tag { background: var(--sev-high-soft); color: var(--sev-high); }
  .sev-medium .sev-tag { background: var(--sev-medium-soft); color: var(--sev-medium); }
  .sev-low .sev-tag { background: var(--sev-low-soft); color: var(--sev-low); }
  .sev-info .sev-tag { background: var(--sev-info-soft); color: var(--sev-info); }
  .finding-title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .finding-loc { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
  .finding-body { padding: 0 16px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .kv-label { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); }
  .kv-text { font-size: 13px; color: var(--text); margin-top: 2px; }
  .evidence-code { font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; color: var(--text-2); white-space: pre-wrap; word-break: break-all; }
  .finding-actions { display: flex; gap: 8px; padding-top: 2px; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 7px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); color: var(--text-2);
    transition: background .12s, color .12s, border-color .12s;
  }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
  .btn-ghost svg { width: 13px; height: 13px; }
  .btn-ghost.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

  .finding-detail { border-top: 1px solid var(--border); background: var(--surface-2); padding: 14px 16px; display: none; flex-direction: column; gap: 14px; }
  .finding.open .finding-detail { display: flex; }

  /* code viewer */
  .cv-tabs { display: flex; gap: 4px; }
  .cv-tab { padding: 5px 11px; border-radius: 7px; font-size: 12px; font-weight: 500; color: var(--text-2); }
  .cv-tab:hover { background: var(--surface-3); color: var(--text); }
  .cv-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .code-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
  }
  .code-scroll { overflow-x: auto; }
  pre.code { font-family: var(--mono); font-size: 12px; line-height: 1.6; padding: 12px 0; margin: 0; }
  pre.code .ln { display: flex; }
  pre.code .ln > .num { flex: none; width: 40px; text-align: right; padding-right: 12px; color: var(--text-3); user-select: none; }
  pre.code .ln > .txt { white-space: pre; padding-right: 16px; }
  pre.code .ln.hl { background: color-mix(in srgb, var(--sev-high) 12%, transparent); }
  pre.code .ln.hl > .num { color: var(--sev-high); font-weight: 600; }
  pre.code .ln.add { background: color-mix(in srgb, var(--ok) 12%, transparent); }
  pre.code .ln.add > .num { color: var(--ok); }
  pre.code .ln.del { background: color-mix(in srgb, var(--sev-critical) 10%, transparent); }
  pre.code .ln.del > .num { color: var(--sev-critical); }
  pre.code .ln.hunk > .txt { color: var(--accent); }
  .hl-kw { color: #8250df; font-weight: 500; }
  .hl-str { color: #0a7a4b; }
  .hl-com { color: var(--text-3); font-style: italic; }
  .hl-num { color: #b6802a; }
  .hl-bi { color: #0550ae; }
  .hl-dec { color: #953800; }
  .theme-dark .hl-kw { color: #c99bf0; }
  .theme-dark .hl-str { color: #7ee0a8; }
  .theme-dark .hl-num { color: #e0b877; }
  .theme-dark .hl-bi { color: #82aaff; }
  .theme-dark .hl-dec { color: #f0a878; }

  /* remediation narrative */
  .remedy { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .remedy p { color: var(--text); }
  .remedy strong { font-weight: 600; }
  .remedy .muted { color: var(--text-2); }

  .verified-badge {
    display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
    padding: 6px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; letter-spacing: .02em;
    background: var(--ok-soft); color: var(--ok);
    border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
  }
  .verify-flow { display: flex; flex-direction: column; gap: 0; margin-top: 2px; }
  .vf-step { display: flex; align-items: center; gap: 10px; font-size: 12.5px; padding: 4px 0; }
  .vf-step .vf-ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .vf-step.done .vf-ic { background: var(--ok-soft); color: var(--ok); }
  .vf-step.fail .vf-ic { background: var(--sev-critical-soft); color: var(--sev-critical); }
  .vf-step.skip .vf-ic { background: var(--surface-2); color: var(--text-3); }
  .vf-step .vf-ic svg { width: 11px; height: 11px; }
  .vf-connect { width: 1px; height: 8px; background: var(--border-strong); margin-left: 8.5px; }

  /* ─────────────────────────  Composer  ───────────────────────── */
  .composer-dock { flex: none; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 92%, transparent); padding: 12px 24px 16px; }
  .composer { max-width: 860px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; transition: border-color .15s; }
  .composer:focus-within { border-color: var(--accent); }
  .composer-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .composer-top input.fname { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; width: 200px; }
  .composer-top input.fname:focus { outline: none; border-color: var(--accent); }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; user-select: none;
    margin-left: auto;
  }
  .toggle input { position: absolute; opacity: 0; }
  .toggle .track { width: 30px; height: 17px; border-radius: 100px; background: var(--border-strong); position: relative; transition: background .15s; flex: none; }
  .toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s var(--step); box-shadow: var(--shadow-sm); }
  .toggle input:checked + .track { background: var(--accent); }
  .toggle input:checked + .track::after { transform: translateX(13px); }
  .toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea#code-in {
    width: 100%; min-height: 120px; max-height: 42vh; resize: none;
    border: none; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6;

  const PY_KW = new Set("def class return if elif else for while try except finally with as import from pass break continue raise yield lambda global nonlocal assert del in is not and or None True False async await match case".split(" "));
  const PY_BI = new Set("print len open range int str list dict set tuple bool float bytes type isinstance issubclass super enumerate zip map filter sorted sum min max abs any all repr hasattr getattr setattr id hash iter next format".split(" "));
  function hlPython(src) {
    const rules = [
      ["com", /#[^\n]*/y],
      ["str", /[rbfu]{0,2}('''[\s\S]*?'''|"""[\s\S]*?"""|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")/y],
      ["dec", /@[A-Za-z_][\w.]*/y],
      ["num", /\b\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?\b/y],
      ["word", /[A-Za-z_]\w*/y],
      ["ws", /\s+/y],
      ["any", /[\s\S]/y],

    while (i < src.length) {

        re.lastIndex = i;

    });
    es.addEventListener("error", () => {
      state.sse = "lost"; renderConn();
      try { es.close(); } catch {}
      const delay = Math.min(1000 * 2 ** state.esRetry++, 15000);
      setTimeout(connectSSE, delay);
    });
  }
  function paintActivity(turn) {
    if (!turn.el) return;
    const box = turn.el.querySelector(".activity");
    if (!box) return;
    box.innerHTML = turn.activity.slice(-40).map((d) =>
      `<div class="a-line"><span class="a-agent">${esc(d.agent || "-")}</span><span class="lvl-${esc(d.level)}">${esc(d.message)}</span></div>`
    ).join("");
    box.scrollTop = box.scrollHeight;
  }

  /* ═══════════════════════  Toast  ═══════════════════════ */
  function toast(msg, kind = "") {
    const el = document.createElement("div");
    el.className = `toast ${kind}`;
    el.innerHTML = `${kind === "ok" ? svg(IC.check, 14) : kind === "err" ? svg(IC.x, 14) : ""}<span>${esc(msg)}</span>`;
    $("#toasts").appendChild(el);
    setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .2s"; setTimeout(() => el.remove(), 220); }, 2600);
  }

  /* ═══════════════════════  Navigation  ═══════════════════════ */
  const NAV = [
    { id: "", label: "New Analysis", icon: IC.scan, hidden: true },
    { g: "Workspace", items: [
      { id: "dashboard", label: "Dashboard", icon: IC.dashboard },
      { id: "history", label: "Analysis History", icon: IC.history },
    ]},
    { g: "Security", items: [
      { id: "findings", label: "Security Findings", icon: IC.findings },
      { id: "remediation", label: "Remediation", icon: IC.remediation },
    ]},
    { g: "Operations", items: [
      { id: "webhooks", label: "Webhooks", icon: IC.webhooks },
      { id: "infrastructure", label: "Infrastructure", icon: IC.infra },
      { id: "settings", label: "Settings", icon: IC.settings },
    ]},
  ];
  function renderNav() {
    const counts = {
      findings: latestReport()?.metrics.total_findings ?? null,
      history: state.sessionAnalyses.length || null,
    };
    let html = "";
    for (const block of NAV) {
      if (!block.g) continue;
      html += `<div class="nav-group"><div class="nav-label">${block.g}</div>`;
      for (const it of block.items) {
        const active = state.route === it.id ? "active" : "";
        const c = counts[it.id];
        html += `<button class="nav-item ${active}" data-route="${it.id}" type="button">${svg(it.icon)}<span>${it.label}</span>${c != null ? `<span class="count">${c}</span>` : ""}</button>`;
      }
      html += `</div>`;
    }
    $("#nav").innerHTML = html;
    $$("#nav .nav-item").forEach((b) => b.addEventListener("click", () => { location.hash = "#/" + b.dataset.route; closeDrawer(); }));
  }

  /* ═══════════════════════  Router  ═══════════════════════ */
  function parseRoute() {
    const h = location.hash.replace(/^#\/?/, "");
    if (h.startsWith("analysis/")) return { route: "analysis", id: h.slice("analysis/".length) };
    const known = ["dashboard", "history", "findings", "remediation", "webhooks", "infrastructure", "settings", "new", ""];
    return { route: known.includes(h) ? (h === "new" ? "" : h) : "", id: null };
  }
  function navigate() {
    const { route, id } = parseRoute();
    state.route = route;
    render(id);
    renderNav();
    $("#top-title").textContent = ({
      "": "Security Assistant", dashboard: "Dashboard", history: "Analysis History",
      findings: "Security Findings", remediation: "Remediation", webhooks: "Webhooks",
      infrastructure: "Infrastructure", settings: "Settings", analysis: "Analysis",
    })[route] || "Security Assistant";
    $("#view").scrollTop = 0;
  }
  window.addEventListener("hashchange", navigate);

  /* ═══════════════════════  Helpers on data  ═══════════════════════ */
  function latestReport() {
    for (let i = state.thread.length - 1; i >= 0; i--) if (state.thread[i].response) return state.thread[i].response;
    return state.sessionAnalyses.at(-1)?.response || null;
  }
  function allFindings() {
    const seen = new Map();
    for (const a of state.sessionAnalyses) for (const f of a.response.findings) seen.set(a.response.analysis_id + f.id, { ...f, _analysis: a.response });
    return [...seen.values()];
  }
  function aggregate() {
    const rs = state.sessionAnalyses.map((a) => a.response);
    const bySev = { critical: 0, high: 0, medium: 0, low: 0, info: 0 };
    let findings = 0, patches = 0, verified = 0, unresolved = 0;
    for (const r of rs) {
      findings += r.metrics.total_findings;
      for (const s of SEV_ORDER) bySev[s] += r.metrics.by_severity?.[s] || 0;
      for (const p of r.patches) { patches++; if (p.validation.status === "validated") verified++; }
      unresolved += r.findings.filter((f) => !r.patches.some((p) => p.target_finding_id === f.id && p.validation.status === "validated")).length;
    }
    return { count: rs.length, findings, bySev, patches, verified, unresolved };
  }

  /* ═══════════════════════  RENDER: dispatch  ═══════════════════════ */
  function render(id) {
    renderConn();
    const v = $("#view");
    switch (state.route) {
      case "": return renderWorkspace(v);
      case "dashboard": return renderDashboard(v);
      case "history": return renderHistory(v);
      case "findings": return renderFindings(v);
      case "remediation": return renderRemediation(v);
      case "webhooks": return renderWebhooks(v);
      case "infrastructure": return renderInfra(v);
      case "settings": return renderSettings(v);
      case "analysis": return renderStoredAnalysis(v, id);
      default: return renderWorkspace(v);
    }
  }

  /* ═══════════════════════  Workspace  ═══════════════════════ */
  function renderWorkspace(v) {
    const offline = state.conn === "offline";
    v.innerHTML = `
      <div id="ws">
        <div id="thread">${state.thread.length ? "" : heroHTML()}</div>
        <div class="composer-dock">
          ${offline ? `<div class="banner" role="alert">${svg(IC.x, 15)} <div>Can't reach the analysis engine${state.apiBase ? ` at <code style="font-family:var(--mono)">${esc(state.apiBase)}</code>` : ""}. Start it with <code style="font-family:var(--mono)">uvicorn main:app</code> (or <code style="font-family:var(--mono)">docker compose up</code>), then open <code style="font-family:var(--mono)">http://localhost:8000/dashboard</code> — or set the API URL in Settings.</div></div>` : ""}
          <form class="composer" id="composer">
            <div class="composer-top">
              <input class="fname" id="c-filename" value="submission.py" aria-label="Filename" spellcheck="false" />
              <label class="toggle">
                <input type="checkbox" id="c-remed" ${localStorage.getItem(LS.remed) === "0" ? "" : "checked"} />
                <span class="track"></span> Generate &amp; verify remediation
              </label>
            </div>
            <textarea id="code-in" placeholder="Paste the Python you want analyzed…" spellcheck="false" aria-label="Code to analyze"></textarea>
            <div class="composer-bottom">
              <span class="composer-hint">⌘/Ctrl + Enter to analyze</span>
              <button class="btn-send" id="c-send" type="submit">${svg(IC.shield, 14)} Analyze</button>
            </div>
          </form>
        </div>
      </div>`;
    $("#ws").style.cssText = "display:flex;flex-direction:column;height:100%";
    $("#thread").style.flex = "1";
    $("#thread").style.overflowY = "auto";

    const ta = $("#code-in");
    if (!state.thread.length) ta.value = $("#sample-code").textContent.trim() + "\n";
    autoGrow(ta);
    ta.addEventListener("input", () => autoGrow(ta));
    $("#composer").addEventListener("submit", (e) => { e.preventDefault(); submitAnalysis(); });
    $("#c-remed").addEventListener("change", (e) => localStorage.setItem(LS.remed, e.target.checked ? "1" : "0"));
    $("#btn-hero-start") && $("#btn-hero-start").addEventListener("click", () => ta.focus());
    // the view was rebuilt — detach stale DOM refs and repaint every turn fresh
    state.thread.forEach((t) => { t.el = null; });
    state.thread.forEach(paintTurn);
    if (state.thread.length) scrollThread();
  }
  function heroHTML() {
    return `
      <div class="hero">
        <h1>Secure your code with confidence.</h1>
        <p>Analyze vulnerabilities. Verify remediation. Understand security risk — without leaving your workflow.</p>
        <button class="hero-btn" id="btn-hero-start" type="button">${svg(IC.shield, 15)} Start Analysis</button>
        <div class="feature-grid">
          ${[
            ["scan", "AST Analysis", "Real abstract-syntax-tree parsing for structural and dangerous-call defects. Code is parsed, never executed."],
            ["key", "Secret Detection", "Signature and entropy scanning for hard-coded credentials, tokens, and connection strings."],
            ["remediation", "Verified Remediation", "Every suggested patch is parsed and re-scanned. Nothing is called ‘fixed’ until the engine proves it."],
            ["findings", "Security Findings", "Command injection, SQL injection, weak crypto, SSRF, insecure deserialization, and more."],
          ].map(([ic, t, d]) => `<div class="feature">${svg(IC[ic] || IC.shield, 18)}<h3>${t}</h3><p>${d}</p></div>`).join("")}
        </div>
      </div>`;
  }
  function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, window.innerHeight * 0.42) + "px"; }
  function scrollThread() { const t = $("#thread"); if (t) t.scrollTop = t.scrollHeight; }

  async function submitAnalysis() {
    if (state.conn === "offline") { toast("Backend is unreachable", "err"); return; }
    const code = $("#code-in").value;
    if (!code.trim()) { toast("Enter some code to analyze", "err"); return; }
    const filename = ($("#c-filename").value || "submission.py").trim();
    const remediation = $("#c-remed").checked;
    const turn = { id: "t" + Date.now(), filename, code, remediation, status: "running", response: null, error: null, activity: [], el: null };
    state.thread.push(turn);
    const hero = $(".hero"); if (hero) hero.remove();
    paintTurn(turn);
    scrollThread();
    $("#c-send").disabled = true;
    $("#code-in").value = "";
    autoGrow($("#code-in"));

    try {
      const r = await fetch(api("/api/v1/analyze"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename, language: "python", source_code: code, enable_remediation: remediation }),
      });
      const data = await r.json();
      if (!r.ok) { turn.status = "error"; turn.error = data; }
      else {
        turn.status = "done"; turn.response = data;
        state.sessionAnalyses.push({ response: data });
        pollHealth();
      }
    } catch (err) {
      turn.status = "error";
      turn.error = { error: "connection_failed", message: `Could not reach the analyzer. ${err.message}` };
    } finally {
      $("#c-send").disabled = false;
      paintTurn(turn);
      renderNav();
      scrollThread();
    }
  }

  function paintTurn(turn) {
    let el = turn.el;
    if (!el) {
      el = document.createElement("div");
      el.className = "turn";
      turn.el = el;
      $("#thread").appendChild(el);
    }
    let assistant = "";
    if (turn.status === "running") {
      assistant = `
        <div class="working"><span class="beacon"></span> Analyzing <code style="font-family:var(--mono)">${esc(turn.filename)}</code>…</div>
        <div class="activity" aria-label="Analysis activity"></div>`;
    } else if (turn.status === "error") {
      assistant = `<div class="banner" role="alert">${svg(IC.x, 15)} <div><strong>${esc(turn.error.error || "Analysis failed")}</strong><br><span style="font-weight:400">${esc(turn.error.message || turn.error.detail || "The analyzer rejected this request.")}</span></div></div>`;
    } else if (turn.response) {
      assistant = assistantReportHTML(turn.response);
    }
    el.innerHTML = `
      <div class="turn-user">
        <div class="u-head">${svg(IC.code, 13)} <span class="chip">${esc(turn.filename)}</span>${turn.remediation ? '<span class="chip">remediation on</span>' : ""}</div>
        <div class="u-code" data-code>${hlPython(turn.code)}<div class="u-code-fade"></div></div>
        <button class="u-toggle" type="button" data-exp>Show full code</button>
      </div>
      <div class="turn-assistant">
        <div class="a-avatar" aria-hidden="true">${svg(IC.shield, 14)}</div>
        <div class="a-body">${assistant}</div>
      </div>`;
    const uc = el.querySelector("[data-code]"), tg = el.querySelector("[data-exp]");
    if (turn.code.split("\n").length <= 6) { tg.style.display = "none"; uc.classList.add("expanded"); uc.querySelector(".u-code-fade").style.display = "none"; }
    tg.addEventListener("click", () => {
      const open = uc.classList.toggle("expanded");
      uc.querySelector(".u-code-fade").style.display = open ? "none" : "block";
      tg.textContent = open ? "Show less" : "Show full code";
    });
    if (turn.status === "running") paintActivity(turn);
    wireReport(el);
  }

  function assistantReportHTML(d) {
    const m = d.metrics;
    const agentPills = d.agent_reports.map((a) => {
      const cl = a.status === "completed" ? "ok" : "err";
      return `<span class="agent-pill ${cl}">${svg(a.status === "completed" ? IC.check : IC.x, 11)} ${esc(a.agent)} · ${a.duration_ms.toFixed(0)}ms</span>`;
    }).join("");
    const findingsHTML = d.findings.length
      ? d.findings.map((f) => findingCardHTML(f, d)).join("")
      : `<div class="verified-badge">${svg(IC.check, 13)} No findings — this code is clean.</div>`;
    return `
      <div class="summary-row">
        <span class="verdict ${d.gate_passed ? "pass" : "fail"}">${svg(d.gate_passed ? IC.check : IC.x, 13)} ${d.gate_passed ? "Gate passed" : "Gate failed"}</span>
        <span class="meta-text">${m.total_findings} finding${m.total_findings === 1 ? "" : "s"} · highest severity <strong>${esc(m.highest_severity)}</strong> · ${d.duration_ms.toFixed(0)} ms${d.stored ? " · saved to history" : ""}</span>
      </div>
      <div class="agent-pills">${agentPills}</div>
      ${d.findings.length ? severityMini(m.by_severity) : ""}
      <div style="display:flex;flex-direction:column;gap:12px">${findingsHTML}</div>`;
  }
  function severityMini(bySev) {
    const total = SEV_ORDER.reduce((s, k) => s + (bySev[k] || 0), 0) || 1;
    const bar = SEV_ORDER.map((k) => (bySev[k] ? `<span style="width:${(bySev[k] / total) * 100}%;background:${SEV_COLOR[k]}"></span>` : "")).join("");
    const legend = SEV_ORDER.filter((k) => bySev[k]).map((k) => `<span><span class="dot" style="background:${SEV_COLOR[k]}"></span>${bySev[k]} ${k}</span>`).join("");
    return `<div><div class="sev-bar">${bar}</div><div class="sev-legend">${legend}</div></div>`;
  }

  function findingCardHTML(f, report) {
    const patch = report.patches.find((p) => p.target_finding_id === f.id);
    const loc = f.position ? `${esc(report.filename)}:${f.position.line}` : esc(report.filename);
    return `
      <div class="finding sev-${f.severity}" data-fid="${esc(f.id)}">
        <div class="finding-head">
          <span class="sev-tag">${f.severity}</span>
          <div style="flex:1;min-width:0">
            <div class="finding-title">${esc(f.title)}</div>
            <div class="finding-loc">${esc(f.category)} · ${loc}</div>
          </div>
        </div>
        <div class="finding-body">
          <div><div class="kv-label">Security impact</div><div class="kv-text">${esc(f.detail)}</div></div>
          ${f.evidence ? `<div><div class="kv-label">Evidence (redacted)</div><div class="evidence-code">${esc(f.evidence)}</div></div>` : ""}
          <div class="finding-actions">
            <button class="btn-ghost" type="button" data-act="code">${svg(IC.code, 13)} View code</button>
            ${patch ? `<button class="btn-ghost" type="button" data-act="remedy">${svg(IC.remediation, 13)} View remediation${patch.validation.status === "validated" ? " ✓" : ""}</button>` : ""}
          </div>
        </div>
        <div class="finding-detail" data-detail></div>
      </div>`;
  }

  function findingDetailHTML(f, report, mode) {
    const patch = report.patches.find((p) => p.target_finding_id === f.id);
    const line = f.position?.line || null;
    const original = patch?.original_snippet || null;
    const startLine = line && original ? Math.max(1, line - 6) : 1;

    let html = `<div class="cv-tabs" role="tablist">`;
    const tabs = [["code", "Flagged code"]];
    if (patch) { tabs.push(["suggested", "Suggested"]); if (patch.unified_diff) tabs.push(["diff", "Diff"]); }
    html += tabs.map(([k, l]) => `<button class="cv-tab ${k === mode ? "active" : ""}" data-tab="${k}" role="tab">${l}</button>`).join("");
    html += `</div><div data-cv>`;

    if (mode === "code") {
      html += original
        ? codeBlock(original, { start: startLine, highlightLine: line })
        : `<p class="meta-text">Line ${line ?? "?"} in ${esc(report.filename)}. Submit again with remediation enabled to see the surrounding snippet.</p>`;
    } else if (mode === "suggested" && patch) {
      html += codeBlock(patch.suggested_code);
    } else if (mode === "diff" && patch) {
      html += diffBlock(patch.unified_diff);
    }
    html += `</div>`;

    if (patch && (mode === "suggested" || mode === "diff" || mode === "remedy")) html += remediationNarrative(f, patch);
    if (!patch) html += `<p class="meta-text" style="margin-top:10px">Remediation was not requested for this analysis.</p>`;
    return html;
  }

  function remediationNarrative(f, patch) {
    const v = patch.validation;
    const verified = v.status === "validated";
    const steps = [
      { label: "Patch generated", state: "done", note: patch.source === "llm" ? `drafted by ${esc(patch.provider || "model")}` : "from a reviewed template" },
      { label: "Patch parsed & validated", state: v.parsed_ok && v.status !== "rejected" ? "done" : "fail", note: (v.errors || []).join("; ") || "" },
      { label: "Code re-scanned", state: v.status === "not_checked" ? "skip" : "done", note: v.status === "not_checked" ? "advisory guidance — not re-scannable" : "" },
      { label: "Original finding resolved", state: v.finding_resolved === true ? "done" : v.finding_resolved === false ? "fail" : "skip", note: (v.residual_categories || []).length ? `still flags: ${v.residual_categories.join(", ")}` : "" },
    ];
    const flow = steps.map((s, i) => `
      ${i ? '<div class="vf-connect"></div>' : ""}
      <div class="vf-step ${s.state}">
        <span class="vf-ic">${svg(s.state === "fail" ? IC.x : s.state === "skip" ? IC.arrow : IC.check, 11)}</span>
        <span>${s.label}${s.note ? ` <span class="muted">— ${s.note}</span>` : ""}</span>
      </div>`).join("");
    return `
      <div class="remedy">
        ${verified ? `<span class="verified-badge">${svg(IC.check, 13)} Verified remediation</span>` : `<span class="verdict ${v.status === "rejected" ? "fail" : ""}" style="align-self:flex-start">${esc(v.status.replace("_", " "))}</span>`}
        <p><strong>Security issue.</strong> <span class="muted">${esc(f.detail)}</span></p>
        <p><strong>Recommended change.</strong> ${esc(patch.summary)}</p>
        <p><strong>Why this helps.</strong> <span class="muted">${esc(patch.rationale)}</span></p>
        <div><div class="kv-label" style="margin-bottom:6px">Verification</div><div class="verify-flow">${flow}</div></div>
      </div>`;
  }

  function wireReport(scope) {
    $$(".finding", scope).forEach((card) => {
      if (card._wired) return;
      card._wired = true;
      const fid = card.dataset.fid;
      const detail = card.querySelector("[data-detail]");
      const report = findReportForFinding(fid);
      if (!detail || !report) return;
      const f = report.findings.find((x) => x.id === fid);
      let mode = "code";
      const paint = () => {
        detail.innerHTML = findingDetailHTML(f, report, mode);
        detail.querySelectorAll("[data-tab]").forEach((t) =>
          t.addEventListener("click", () => { mode = t.dataset.tab; paint(); }));
      };
      card.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
        const want = b.dataset.act === "remedy" ? "suggested" : "code";
        if (card.classList.contains("open") && mode === want) { card.classList.remove("open"); return; }
        mode = want; card.classList.add("open"); paint();
      }));
    });
  }
  function findReportForFinding(fid) {
    for (const t of state.thread) if (t.response && t.response.findings.some((f) => f.id === fid)) return t.response;
    for (const a of state.sessionAnalyses) if (a.response.findings.some((f) => f.id === fid)) return a.response;
    return null;
  }

  /* ═══════════════════════  Dashboard  ═══════════════════════ */
  function renderDashboard(v) {
    const g = aggregate();
    if (!g.count) { v.innerHTML = pageEmpty("dashboard", "No analyses yet", "Run your first analysis to populate the dashboard.", true); wireEmpty(v); return; }
    v.innerHTML = `
      <div class="page">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-sub">Summary of ${g.count} analysis run${g.count === 1 ? "" : "s"} this session${state.health?.persistence_enabled ? " · history is persisted" : ""}.</p>
        <div class="metric-grid" style="margin-top:20px">
          <div class="metric-card"><div class="mv">${fmtNum(g.count)}</div><div class="ml">Analyses run</div></div>
          <div class="metric-card"><div class="mv">${fmtNum(g.findings)}</div><div class="ml">Total findings</div></div>
          <div class="metric-card crit"><div class="mv">${fmtNum(g.bySev.critical + g.bySev.high)}</div><div class="ml">High &amp; critical</div></div>
          <div class="metric-card ok"><div class="mv">${fmtNum(g.verified)}</div><div class="ml">Verified remediations</div><div class="ms">of ${g.patches} generated</div></div>
          <div class="metric-card"><div class="mv">${fmtNum(g.unresolved)}</div><div class="ml">Unresolved findings</div></div>
        </div>
        <div class="section-title">Severity distribution</div>
        ${severityMini(g.bySev)}
        <div class="section-title">Recent analyses</div>
        <div class="list-card">${state.sessionAnalyses.slice(-6).reverse().map((a) => historyRow(a.response)).join("")}</div>
      </div>`;
    wireHistoryRows(v);
  }

  /* ═══════════════════════  History  ═══════════════════════ */
  async function renderHistory(v) {
    v.innerHTML = `<div class="page"><h1 class="page-title">Analysis History</h1><p class="page-sub">Loading…</p></div>`;
    let rows = [];
    let persisted = state.health?.persistence_enabled;
    if (persisted) {
      try {
        const list = await apiGet("/api/v1/analyses?limit=100");
        rows = list.analyses.map((s) => ({ stored: true, s }));
      } catch { persisted = false; }
    }
    if (!persisted) rows = state.sessionAnalyses.slice().reverse().map((a) => ({ stored: false, r: a.response }));
    if (!rows.length) { v.innerHTML = pageEmpty("history", "No analyses yet", "Analyses you run appear here. Enable persistence to keep them across restarts.", true); wireEmpty(v); return; }
    v.innerHTML = `
      <div class="page">
        <h1 class="page-title">Analysis History</h1>
        <p class="page-sub">${rows.length} ${persisted ? "stored" : "session"} analys${rows.length === 1 ? "is" : "es"}${persisted ? "" : " · not persisted (set DEVSECOPS_PERSISTENCE_ENABLED=true)"}.</p>
        <div class="list-card" style="margin-top:18px">
          ${rows.map((row) => row.stored ? historySummaryRow(row.s) : historyRow(row.r)).join("")}
        </div>
      </div>`;
    wireHistoryRows(v);
  }
  function historyRow(r) {
    const bs = r.metrics.by_severity || {};
    return `<div class="list-row clickable" data-analysis="${esc(r.analysis_id)}" data-session="1">
      <div class="lr-main">
        <div class="lr-title">${esc(r.filename)}</div>
        <div class="lr-sub">${r.metrics.total_findings} findings · ${bs.critical || 0} critical · ${bs.high || 0} high · ${r.patches.filter((p) => p.validation.status === "validated").length} verified fixes</div>
      </div>
      <div class="lr-meta">${fmtDate(r.created_at)}<br>${r.gate_passed ? "gate passed" : "gate failed"}</div>
    </div>`;
  }
  function historySummaryRow(s) {
    return `<div class="list-row clickable" data-analysis="${esc(s.analysis_id)}">
      <div class="lr-main">
        <div class="lr-title">${esc(s.filename)}</div>
        <div class="lr-sub">${s.total_findings} findings · highest ${esc(s.highest_severity)} · remediation ${esc(s.remediation_mode)}</div>
      </div>
      <div class="lr-meta">${fmtDate(s.created_at)}<br>${s.gate_passed ? "gate passed" : "gate failed"}</div>
    </div>`;
  }
  function wireHistoryRows(scope) {
    $$("[data-analysis]", scope).forEach((row) => row.addEventListener("click", () => {
      location.hash = "#/analysis/" + row.dataset.analysis;
    }));
  }

  async function renderStoredAnalysis(v, id) {
    let report = state.sessionAnalyses.find((a) => a.response.analysis_id === id)?.response;
    if (!report) {
      v.innerHTML = `<div class="page"><p class="page-sub">Loading analysis…</p></div>`;
      try { report = await apiGet(`/api/v1/analyses/${encodeURIComponent(id)}/report`); }
      catch { v.innerHTML = pageEmpty("history", "Analysis not found", "This analysis is not in this session and persistence did not return it.", false); return; }
    }
    v.innerHTML = `<div class="page wide">
      <button class="btn-ghost" onclick="history.back()" style="margin-bottom:16px">${svg(IC.arrow, 13)} Back</button>
      <h1 class="page-title">${esc(report.filename)}</h1>
      <p class="page-sub">${fmtDate(report.created_at)} · analysis <code style="font-family:var(--mono)">${esc(report.analysis_id.slice(0, 12))}</code></p>
      <div class="turn-assistant" style="margin-top:20px"><div class="a-avatar">${svg(IC.shield, 14)}</div><div class="a-body">${assistantReportHTML(report)}</div></div>
    </div>`;
    // stash so wireReport can find it
    if (!state.sessionAnalyses.some((a) => a.response.analysis_id === report.analysis_id)) state.sessionAnalyses.push({ response: report });
    wireReport(v);
  }

  /* ═══════════════════════  Findings  ═══════════════════════ */
  let findingFilter = { sev: "all", cat: "all" };
  function renderFindings(v) {
    const items = allFindings();
    if (!items.length) { v.innerHTML = pageEmpty("findings", "No findings yet", "Findings from your analyses are collected here.", true); wireEmpty(v); return; }
    const cats = [...new Set(items.map((f) => f.category))].sort();
    const shown = items.filter((f) => (findingFilter.sev === "all" || f.severity === findingFilter.sev) && (findingFilter.cat === "all" || f.category === findingFilter.cat));
    shown.sort((a, b) => SEV_ORDER.indexOf(a.severity) - SEV_ORDER.indexOf(b.severity));
    v.innerHTML = `
      <div class="page">
        <h1 class="page-title">Security Findings</h1>
        <p class="page-sub">${items.length} finding${items.length === 1 ? "" : "s"} across ${state.sessionAnalyses.length} analys${state.sessionAnalyses.length === 1 ? "is" : "es"} this session.</p>
        <div class="filter-bar" style="margin-top:16px">
          ${["all", ...SEV_ORDER.filter((s) => items.some((f) => f.severity === s))].map((s) => `<button class="filter-chip ${findingFilter.sev === s ? "active" : ""}" data-sev="${s}">${s === "all" ? "All severities" : s}</button>`).join("")}
        </div>
        <div class="filter-bar">
          ${["all", ...cats].map((c) => `<button class="filter-chip ${findingFilter.cat === c ? "active" : ""}" data-cat="${c}">${c === "all" ? "All categories" : c.replace(/_/g, " ")}</button>`).join("")}
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
          ${shown.map((f) => findingCardHTML(f, f._analysis)).join("") || `<p class="meta-text">No findings match this filter.</p>`}
        </div>
      </div>`;
    $$("[data-sev]", v).forEach((b) => b.addEventListener("click", () => { findingFilter.sev = b.dataset.sev; renderFindings(v); }));
    $$("[data-cat]", v).forEach((b) => b.addEventListener("click", () => { findingFilter.cat = b.dataset.cat; renderFindings(v); }));
    wireReport(v);
  }

  /* ═══════════════════════  Remediation  ═══════════════════════ */
  function renderRemediation(v) {
    const reports = state.sessionAnalyses.map((a) => a.response).filter((r) => r.patches.length);
    if (!reports.length) { v.innerHTML = pageEmpty("remediation", "No remediation yet", "Run an analysis with remediation enabled to see verified patches here.", true); wireEmpty(v); return; }
    const patches = [];
    for (const r of reports) for (const p of r.patches) patches.push({ p, r, f: r.findings.find((x) => x.id === p.target_finding_id) });
    const verified = patches.filter((x) => x.p.validation.status === "validated").length;
    v.innerHTML = `
      <div class="page wide">
        <h1 class="page-title">Remediation</h1>
        <p class="page-sub">${verified} of ${patches.length} generated patches verified as resolving their finding.</p>
        <div style="display:flex;flex-direction:column;gap:16px;margin-top:20px">
          ${patches.map(({ p, r, f }) => `
            <div class="finding sev-${f?.severity || "info"}">
              <div class="finding-head">
                <span class="sev-tag">${f?.severity || "info"}</span>
                <div style="flex:1"><div class="finding-title">${esc(f?.title || p.category)}</div><div class="finding-loc">${esc(r.filename)}${f?.position ? ":" + f.position.line : ""} · ${esc(p.category)}</div></div>
              </div>
              <div class="finding-body">
                ${remediationNarrative(f || { detail: p.rationale }, p)}
                <div class="cv-tabs">${p.unified_diff ? '<button class="cv-tab active" data-t="diff">Diff</button><button class="cv-tab" data-t="sug">Suggested</button>' : '<button class="cv-tab active" data-t="sug">Suggested</button>'}</div>
                <div data-cvout>${p.unified_diff ? diffBlock(p.unified_diff) : codeBlock(p.suggested_code)}</div>
              </div>
            </div>`).join("")}
        </div>
      </div>`;
    $$(".finding", v).forEach((card, i) => {
      const { p } = patches[i];
      card.querySelectorAll("[data-t]").forEach((t) => t.addEventListener("click", () => {
        card.querySelectorAll("[data-t]").forEach((x) => x.classList.toggle("active", x === t));
        card.querySelector("[data-cvout]").innerHTML = t.dataset.t === "diff" ? diffBlock(p.unified_diff) : codeBlock(p.suggested_code);
      }));
    });
  }

  /* ═══════════════════════  Webhooks  ═══════════════════════ */
  async function renderWebhooks(v) {
    const enabled = state.health?.webhook_enabled;
    v.innerHTML = `<div class="page"><h1 class="page-title">Webhooks</h1><p class="page-sub">Loading…</p></div>`;
    let deliveries = [];
    try { deliveries = (await apiGet("/api/v1/webhook/deliveries")).deliveries; } catch {}
    v.innerHTML = `
      <div class="page">
        <h1 class="page-title">Webhooks</h1>
        <p class="page-sub">GitHub <code style="font-family:var(--mono)">push</code> / <code style="font-family:var(--mono)">pull_request</code> events trigger analysis of changed Python files.</p>
        <div class="setting-row" style="border-top:1px solid var(--border);margin-top:16px">
          <div class="sr-main">
            <div class="sr-title">Webhook endpoint</div>
            <div class="sr-desc">${enabled
              ? "Active. Requests are verified with HMAC-SHA256 and changed files are fetched from pinned GitHub hosts only."
              : "Disabled. Set <code style=\"font-family:var(--mono)\">DEVSECOPS_GITHUB_WEBHOOK_SECRET</code> to enable, then point a GitHub webhook at <code style=\"font-family:var(--mono)\">POST /api/v1/webhook</code>."}</div>
          </div>
          <span class="status-chip ${enabled ? "ok" : ""}"><span class="dot"></span>${enabled ? "Enabled" : "Disabled"}</span>
        </div>
        <div class="section-title">Recent deliveries</div>
        ${deliveries.length ? `<div class="list-card">${deliveries.map(webhookRow).join("")}</div>`
          : `<div class="empty" style="padding:36px">${svg(IC.webhooks, 26)}<h3>No deliveries yet</h3><p>Verified webhook deliveries and their per-file results will appear here.</p></div>`}
      </div>`;
  }
  function webhookRow(w) {
    return `<div class="list-row">
      <div class="lr-main">
        <div class="lr-title">${esc(w.repository)} <span class="chip">${esc(w.event)}</span></div>
        <div class="lr-sub">${w.files.map((f) => `${esc(f.filename)} — ${f.analyzed ? `${f.total_findings} findings, ${esc(f.highest_severity)}` : "skipped: " + esc(f.error || "")}`).join(" · ") || "no analyzable files"}</div>
      </div>
      <div class="lr-meta">${esc(w.sha.slice(0, 8))}<br>${w.gate_passed ? "gate passed" : "gate failed"}</div>
    </div>`;
  }

  /* ═══════════════════════  Infrastructure  ═══════════════════════ */
  function renderInfra(v) {
    const h = state.health;
    const comp = [
      ["Backend API", state.conn === "online"],
      ["Real-time stream (SSE)", state.sse === "open"],
      ["Analysis history (SQLite)", !!h?.persistence_enabled, h ? (h.persistence_enabled ? "enabled" : "disabled") : "unknown"],
      ["AI remediation provider", !!h?.llm_live, h ? (h.llm_live ? h.llm_provider : "templates only") : "unknown"],
      ["GitHub webhook", !!h?.webhook_enabled, h ? (h.webhook_enabled ? "enabled" : "disabled") : "unknown"],
    ];
    v.innerHTML = `
      <div class="page">
        <h1 class="page-title">Infrastructure</h1>
        <p class="page-sub">Live component status reported by the engine.</p>
        <div class="section-title">Pipeline</div>
        <div class="flow">
          ${["Code submission", "AST + pattern scan", "Remediation draft", "Patch verification (re-scan)", "Result + history"].map((n, i) =>
            `${i ? `<span class="flow-arrow">${svg(IC.arrow, 14).replace('viewBox="0 0 24 24"', 'viewBox="0 0 24 24" style="transform:rotate(90deg)"')}</span>` : ""}<div class="flow-node">${n}</div>`).join("")}
        </div>
        <div class="section-title">Components</div>
        <div class="list-card">
          ${comp.map(([name, ok, note]) => `<div class="list-row"><div class="lr-main"><div class="lr-title">${name}</div>${note ? `<div class="lr-sub">${esc(note)}</div>` : ""}</div><span class="status-chip ${ok ? "ok" : "bad"}"><span class="dot"></span>${ok ? "Online" : "Offline"}</span></div>`).join("")}
        </div>
        <div class="section-title">Runtime</div>
        <div class="list-card">
          <div class="list-row"><div class="lr-main"><div class="lr-title">Service version</div></div><span class="lr-meta">${esc(h?.version || "—")}</span></div>
          <div class="list-row"><div class="lr-main"><div class="lr-title">Environment</div></div><span class="lr-meta">${esc(h?.environment || "—")}</span></div>
          <div class="list-row"><div class="lr-main"><div class="lr-title">Active pipelines</div></div><span class="lr-meta">${h?.active_pipelines ?? "—"}</span></div>
          <div class="list-row"><div class="lr-main"><div class="lr-title">Telemetry subscribers</div></div><span class="lr-meta">${h?.log_subscribers ?? "—"}</span></div>
        </div>
      </div>`;
  }

  /* ═══════════════════════  Settings  ═══════════════════════ */
  function renderSettings(v) {
    const h = state.health;
    v.innerHTML = `
      <div class="page">
        <h1 class="page-title">Settings</h1>
        <p class="page-sub">Connection and appearance. Changes are stored in this browser only.</p>
        <div class="section-title">Connection</div>
        <div>
          <div class="setting-row">
            <div class="sr-main"><div class="sr-title">API base URL</div><div class="sr-desc">Leave blank to use the same origin as this page.</div></div>
            <input type="text" id="set-base" value="${esc(localStorage.getItem(LS.base) ?? "")}" placeholder="https://localhost:8000" spellcheck="false" />
          </div>
          <div class="setting-row">
            <div class="sr-main"><div class="sr-title">Status</div><div class="sr-desc">Backend ${state.conn} · real-time ${state.sse}</div></div>
            <button class="btn-ghost" id="set-test">${svg(IC.arrow, 13)} Test &amp; reconnect</button>
          </div>
        </div>
        <div class="section-title">Appearance</div>
        <div class="setting-row">
          <div class="sr-main"><div class="sr-title">Theme</div><div class="sr-desc">Follows your system setting by default.</div></div>
          <div class="seg" role="group" aria-label="Theme">
            ${["system", "light", "dark"].map((t) => `<button data-theme-set="${t}" class="${state.theme === t ? "active" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}
          </div>
        </div>
        <div class="section-title">Engine capabilities</div>
        <div class="list-card">
          <div class="list-row"><div class="lr-main"><div class="lr-title">Version</div></div><span class="lr-meta">${esc(h?.version || "—")}</span></div>
          <div class="list-row"><div class="lr-main"><div class="lr-title">Environment</div></div><span class="lr-meta">${esc(h?.environment || "—")}</span></div>
          <div class="list-row"><div class="lr-main"><div class="lr-title">Remediation mode</div></div><span class="lr-meta">${h ? (h.llm_live ? esc(h.llm_provider) + " (live)" : "verified templates") : "—"}</span></div>
          <div class="list-row"><div class="lr-main"><div class="lr-title">Persistence</div></div><span class="lr-meta">${h ? (h.persistence_enabled ? "enabled" : "disabled") : "—"}</span></div>
          <div class="list-row"><div class="lr-main"><div class="lr-title">Webhook</div></div><span class="lr-meta">${h ? (h.webhook_enabled ? "enabled" : "disabled") : "—"}</span></div>
        </div>
      </div>`;
    $("#set-base").addEventListener("change", (e) => {
      const val = e.target.value.trim();
      if (val) localStorage.setItem(LS.base, val); else localStorage.removeItem(LS.base);
      state.apiBase = localStorage.getItem(LS.base) ?? _apiDefault();
      reconnect();
    });
    $("#set-test").addEventListener("click", async () => { await reconnect(); toast(state.conn === "online" ? "Connected" : "Still unreachable", state.conn === "online" ? "ok" : "err"); });
    $$("[data-theme-set]", v).forEach((b) => b.addEventListener("click", () => { state.theme = b.dataset.themeSet; localStorage.setItem(LS.theme, state.theme); applyTheme(); renderSettings(v); }));
  }
  async function reconnect() { await pollHealth(); connectSSE(); if (state.route === "settings") renderSettings($("#view")); }

  /* ═══════════════════════  Empty state helper  ═══════════════════════ */
  function pageEmpty(icon, title, body, cta) {
    return `<div class="page"><div class="empty">${svg(IC[icon] || IC.shield, 30)}<h3>${title}</h3><p>${body}</p>${cta ? `<button class="hero-btn" id="empty-cta">${svg(IC.shield, 14)} Start Analysis</button>` : ""}</div></div>`;
  }
  function wireEmpty(v) { const b = $("#empty-cta", v); if (b) b.addEventListener("click", () => { location.hash = "#/new"; }); }

  /* ═══════════════════════  Drawer / a11y  ═══════════════════════ */
  const shell = $("#shell");
  function openDrawer() { shell.classList.add("drawer-open"); }
  function closeDrawer() { shell.classList.remove("drawer-open"); }
  $("#btn-drawer").addEventListener("click", openDrawer);
  $("#scrim").addEventListener("click", closeDrawer);
  $("#btn-collapse").addEventListener("click", () => shell.classList.toggle("collapsed"));
  $("#btn-new").addEventListener("click", () => { location.hash = "#/new"; closeDrawer(); const ta = $("#code-in"); if (ta) ta.focus(); });
  $("#btn-theme").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : state.theme === "light" ? "system" : "dark";
    localStorage.setItem(LS.theme, state.theme); applyTheme();
    if (state.route === "settings") renderSettings($("#view"));
    toast("Theme: " + state.theme);
  });
  $("#btn-refresh").addEventListener("click", () => { pollHealth(); connectSSE(); toast("Refreshed"); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDrawer();
    if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); if (state.route !== "") location.hash = "#/new"; setTimeout(() => $("#code-in")?.focus(), 60); }
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && state.route === "") { e.preventDefault(); submitAnalysis(); }
  });

  /* ═══════════════════════  Boot  ═══════════════════════ */
  applyTheme();
  renderNav();
  navigate();
  pollHealth().then(connectSSE);
  setInterval(pollHealth, 12000);
})();
</script>
</body>
</html>
