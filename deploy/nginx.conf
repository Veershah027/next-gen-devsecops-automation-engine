# Dashboard container config (nginx-unprivileged, listens on 8080).
# Serves the static UI and reverse-proxies the API to the engine container so
# the whole app is same-origin — no CORS, no API-URL configuration needed.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # small, static: the single-file workspace UI
    location = / {
        try_files /index.html =404;
    }
    location = /dashboard {
        try_files /index.html =404;
    }

    # everything the engine owns
    location ~ ^/(health|api/|openapi\.json|docs) {
        proxy_pass http://engine:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # required for the SSE telemetry stream
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
